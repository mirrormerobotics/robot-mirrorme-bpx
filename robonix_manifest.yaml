manifestVersion: 1
name: robonix.robot.mirrorme.bpx

catalog:
  name: robonix.robot.mirrorme.bpx
  version: 0.1.0-dev.4
  description: Dockerized MirrorMe BPX deployment with odometry, stand/sit, bounded move and velocity control.
  license: BSD-3-Clause
  tags: [robot, deploy, quadruped, mirrorme, bpx, docker, odom, posture, move, twist]
  maintainers:
    - M1chael0919 <2956011381@qq.com>

# The Primitive is fetched from an immutable release
# tag and exposes odometry, posture, move and twist_in. Startup itself
# does not move the robot; the wheel remains an external host artifact.
env:
  ROS_DOMAIN_ID: "223"
  BPX_SDK_WHEEL: "${BPX_SDK_WHEEL}"

system:
  atlas:
    listen: 127.0.0.1:50051
  soma:
    listen: 127.0.0.1:50091

primitive:
  - name: mirrorme_bpx
    url: https://github.com/mirrormerobotics/primitive-mirrorme-bpx-quadruped-rbnx
    branch: v0.1.0-dev.4
    manifest: package_manifest.x86-docker.yaml
    config:
      backend: sdk
      allow_motion: true
      enable_posture_service: true
      enable_motion_service: true
      auto_arm_fake: false
      robot_ip: 10.21.20.1
      robot_state_port: 9873
      state_rate_hz: 50
      command_rate_hz: 50
      sdk_tcp_local_port: 0
      sdk_connect_timeout_s: 10.0
      sdk_poll_period_s: 0.05
      odom_topic: /odom
      joint_states_topic: /joint_states
      odom_frame: odom
      base_frame: base_link
      odom_rate_hz: 50.0
      publish_odom_tf: false
      state_timeout_s: 0.5
      posture_stand_timeout_s: 15.0
      posture_sit_timeout_s: 15.0
      posture_poll_period_s: 0.2
      posture_cleanup_sit_flush_s: 1.0

service: []
skill: []
